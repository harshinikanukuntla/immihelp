[project]
name = "sponsorscope-backend"
version = "0.1.0"
description = "SponsorScope lookup API and government-data ETL pipelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "rapidfuzz>=3.11",
    "httpx>=0.28",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "slowapi>=0.1.9",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
sponsorscope-etl = "etl.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "etl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends()/Query() in argument defaults is FastAPI's intended idiom; the
# "mutable default" concern B008 guards against does not apply to them.
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Our own deprecation warnings are errors; we should not be ignoring them.
    "error::DeprecationWarning",
    # Dependencies' internals are not ours to fix, and letting them fail
    # collection means a Python upgrade can silently disable the whole suite.
    # slowapi calls asyncio.iscoroutinefunction at import time on Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
